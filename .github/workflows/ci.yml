name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API service image
        uses: docker/build-push-action@v6
        with:
          context: ./api-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/secure-api-service:latest

      - name: Build and push logging service image
        uses: docker/build-push-action@v6
        with:
          context: ./logging-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/secure-logging-service:latest
