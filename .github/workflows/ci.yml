name: CI - Build Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API service image
        run: |
          docker build -t api-service ./api-service

      - name: Build Logging service image
        run: |
          docker build -t logging-service ./logging-service
